# 利用側リポジトリに置くworkflowの例。
# リポジトリ直下に nippotion.json を置き、Secretsに NOTION_API_TOKEN / SLACK_BOT_API_TOKEN を登録して使う。
name: nippotion

on:
  schedule:
    # 9:30 JST（平日判定はnippotion側で行うため毎日起動してよい）
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'デバッグモード (Slackに投稿しない)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 自リポジトリのnippotion.jsonを取得するために必要
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npx nippotion@1 ${{ github.event.inputs.debug_mode == 'true' && '--debug' || '' }}
        env:
          TZ: 'Asia/Tokyo'
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_API_TOKEN: ${{ secrets.SLACK_BOT_API_TOKEN }}
