name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs as a job in this same workflow run (not a separate on:push:tags workflow),
  # because tags pushed by the default GITHUB_TOKEN don't trigger other workflows
  publish:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # Required for npm's OIDC-based Trusted Publishing (no NPM_TOKEN needed)
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag }}

      # v6 still writes a dummy NODE_AUTH_TOKEN into .npmrc that can break OIDC
      # Trusted Publishing (fixed only in v7, see actions/setup-node#1440/#1558)
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Trusted Publishing requires npm >= 11.5.1; upgrade in case the runner's
      # bundled npm is older
      - name: Update npm
        run: npm install -g npm@latest

      # Belt-and-suspenders: even fixed setup-node versions have intermittently
      # shipped a placeholder _authToken line that makes npm skip the OIDC
      # exchange and fail with ENEEDAUTH/404. Strip it so OIDC is used.
      - name: Remove placeholder npm auth token
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - name: Publish to npm
        run: npm publish
